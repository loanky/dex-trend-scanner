name: DEX Pool Scan (Weekly)

on:
  schedule:
    - cron: '0 0 * * 1'   # Monday 00:00 UTC, every week
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    # GitHub-hosted runners cap job execution at 360 minutes (6 hours) --
    # this is a HARD ceiling, confirmed directly from GitHub's own
    # actions-limits docs; setting anything above 360 is silently capped
    # back down to 360, it does not buy more time.
    #
    # 100 minutes here, computed from the CORRECTED GeckoTerminal rate
    # limit (2.5s/call, confirmed 30/min from their own FAQ/changelog --
    # an earlier version of this workflow used a stale 90-min figure based
    # on an unverified 6.5s/call placeholder). Even a generously-high
    # 400-candidate-pool worst case at max_pages_per_rank=20 (config.yaml)
    # computes to under 40 minutes of rate-limiter-floor time -- 100
    # minutes leaves over 2x that as margin for real network latency this
    # estimate can't capture, while staying well under the requested
    # 2-hour ceiling.
    #
    # WHAT HAPPENS ON TIMEOUT: GitHub sends SIGINT, waits ~7.5s, sends
    # SIGTERM, waits ~2.5s, then force-kills the whole process tree if
    # still running (confirmed from GitHub's own workflow-cancellation
    # docs). The job is marked failed. static_cache.json is only written
    # once, at the very end of a fully successful run_once() -- so a
    # mid-run kill doesn't corrupt state, but any pool not yet reached that
    # cycle simply isn't evaluated or emailed; it's picked up fresh next
    # scheduled run. Raise this further if real runs get close to it --
    # check the Actions tab rather than assume more margin is needed.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MATCH_EMAIL_RECIPIENTS: ${{ secrets.MATCH_EMAIL_RECIPIENTS }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 scanner.py --config config.yaml --once --log-level INFO

      # static_cache.json is the only state file left to persist between
      # runs (repeat-match suppression was removed on request, so there is
      # no longer an emailed-pairs file to commit). Committing this also
      # resets the 60-day auto-disable clock every week.
      - name: Persist static cache
        run: |
          git config user.name "dex-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add static_cache.json
          git diff --staged --quiet || git commit -m "update static cache [skip ci]"
          git push
